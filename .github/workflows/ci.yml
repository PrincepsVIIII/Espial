name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run check:repo

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - run: npm run build
        working-directory: web

  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: espial_test
          POSTGRES_USER: espial
          POSTGRES_PASSWORD: espial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U espial -d espial_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      ESPIAL_TEST_DATABASE_URL: postgres://espial:espial_test@127.0.0.1:5432/espial_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: go vet ./...
        working-directory: core
      - run: go test -race ./...
        working-directory: core
