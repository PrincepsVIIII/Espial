services:
  web:
    build:
      context: ../../web
    environment:
      ESPIAL_CORE_URL: http://core:8080
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ESPIAL_WEB_PORT:-5173}:5173"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    build:
      context: ../../core
    environment:
      ESPIAL_ENV: development
      ESPIAL_LISTEN_ADDRESS: 0.0.0.0:8080
      ESPIAL_PUBLIC_URL: ${ESPIAL_PUBLIC_URL:-http://localhost:5173}
      ESPIAL_AUTH_MODE: ${ESPIAL_AUTH_MODE:-local}
      ESPIAL_AUTH_SESSION_IDLE: ${ESPIAL_AUTH_SESSION_IDLE:-30m}
      ESPIAL_AUTH_SESSION_ABSOLUTE: ${ESPIAL_AUTH_SESSION_ABSOLUTE:-12h}
      ESPIAL_AUTH_FAILURE_LIMIT: ${ESPIAL_AUTH_FAILURE_LIMIT:-5}
      ESPIAL_AUTH_LOCKOUT_DURATION: ${ESPIAL_AUTH_LOCKOUT_DURATION:-15m}
      ESPIAL_AUTH_LOGIN_RATE_LIMIT: ${ESPIAL_AUTH_LOGIN_RATE_LIMIT:-10}
      ESPIAL_AUTH_LOGIN_RATE_WINDOW: ${ESPIAL_AUTH_LOGIN_RATE_WINDOW:-1m}
      ESPIAL_DATABASE_MIGRATE_ON_START: ${ESPIAL_DATABASE_MIGRATE_ON_START:-true}
      ESPIAL_DATABASE_MAX_OPEN_CONNECTIONS: ${ESPIAL_DATABASE_MAX_OPEN_CONNECTIONS:-20}
      ESPIAL_SAMPLE_ADAPTER_EXECUTABLE: ${ESPIAL_SAMPLE_ADAPTER_EXECUTABLE:-/espial-sample-adapter}
      ESPIAL_WEBCHECK_EXECUTABLE: ${ESPIAL_WEBCHECK_EXECUTABLE:-/espial-webcheck-adapter}
      ESPIAL_WEBCHECK_MAX_REDIRECTS: ${ESPIAL_WEBCHECK_MAX_REDIRECTS:-0}
      ESPIAL_WEBCHECK_RESPONSE_BODY_LIMIT_BYTES: ${ESPIAL_WEBCHECK_RESPONSE_BODY_LIMIT_BYTES:-262144}
      ESPIAL_WEBCHECK_RESPONSE_HEADER_LIMIT_BYTES: ${ESPIAL_WEBCHECK_RESPONSE_HEADER_LIMIT_BYTES:-32768}
      ESPIAL_WEBCHECK_RESOLVE_TIMEOUT: ${ESPIAL_WEBCHECK_RESOLVE_TIMEOUT:-2s}
      ESPIAL_WEBCHECK_APPROVED_HOSTS: ${ESPIAL_WEBCHECK_APPROVED_HOSTS:-}
      ESPIAL_WEBCHECK_APPROVED_CIDRS: ${ESPIAL_WEBCHECK_APPROVED_CIDRS:-}
      ESPIAL_WEBCHECK_ALLOWED_PORTS: ${ESPIAL_WEBCHECK_ALLOWED_PORTS:-80,443}
      ESPIAL_WEBCHECK_SECRET_DIRECTORY: /run/secrets
      ESPIAL_ADAPTER_GLOBAL_CONCURRENCY: ${ESPIAL_ADAPTER_GLOBAL_CONCURRENCY:-4}
      ESPIAL_ADAPTER_RECONCILE_INTERVAL: ${ESPIAL_ADAPTER_RECONCILE_INTERVAL:-10s}
      ESPIAL_FRESHNESS_INTERVAL: ${ESPIAL_FRESHNESS_INTERVAL:-1s}
      ESPIAL_FRESHNESS_BATCH_SIZE: ${ESPIAL_FRESHNESS_BATCH_SIZE:-100}
      ESPIAL_EVENT_REPLAY_SIZE: ${ESPIAL_EVENT_REPLAY_SIZE:-1024}
      ESPIAL_INCIDENT_WORKER_CONCURRENCY: ${ESPIAL_INCIDENT_WORKER_CONCURRENCY:-2}
      ESPIAL_INCIDENT_CLAIM_BATCH_SIZE: ${ESPIAL_INCIDENT_CLAIM_BATCH_SIZE:-50}
      ESPIAL_INCIDENT_POLL_INTERVAL: ${ESPIAL_INCIDENT_POLL_INTERVAL:-1s}
      ESPIAL_INCIDENT_CLAIM_LEASE: ${ESPIAL_INCIDENT_CLAIM_LEASE:-30s}
      ESPIAL_INCIDENT_MAX_SIGNAL_ATTEMPTS: ${ESPIAL_INCIDENT_MAX_SIGNAL_ATTEMPTS:-8}
      ESPIAL_SSE_HEARTBEAT: ${ESPIAL_SSE_HEARTBEAT:-15s}
      ESPIAL_SSE_MAX_CLIENTS: ${ESPIAL_SSE_MAX_CLIENTS:-100}
      ESPIAL_NOTIFICATION_WORKER_CONCURRENCY: ${ESPIAL_NOTIFICATION_WORKER_CONCURRENCY:-2}
      ESPIAL_NOTIFICATION_POLL_INTERVAL: ${ESPIAL_NOTIFICATION_POLL_INTERVAL:-1s}
      ESPIAL_NOTIFICATION_CLAIM_LEASE: ${ESPIAL_NOTIFICATION_CLAIM_LEASE:-30s}
      ESPIAL_NOTIFICATION_MAX_ATTEMPTS: ${ESPIAL_NOTIFICATION_MAX_ATTEMPTS:-6}
      ESPIAL_NOTIFICATION_MAX_RETRY_DELAY: ${ESPIAL_NOTIFICATION_MAX_RETRY_DELAY:-5m}
      ESPIAL_NOTIFICATION_REQUEST_TIMEOUT: ${ESPIAL_NOTIFICATION_REQUEST_TIMEOUT:-10s}
      ESPIAL_NOTIFICATION_RESOLVE_TIMEOUT: ${ESPIAL_NOTIFICATION_RESOLVE_TIMEOUT:-2s}
      ESPIAL_NOTIFICATION_RESPONSE_BODY_LIMIT_BYTES: ${ESPIAL_NOTIFICATION_RESPONSE_BODY_LIMIT_BYTES:-4096}
      ESPIAL_NOTIFICATION_APPROVED_HOSTS: ${ESPIAL_NOTIFICATION_APPROVED_HOSTS:-}
      ESPIAL_NOTIFICATION_APPROVED_CIDRS: ${ESPIAL_NOTIFICATION_APPROVED_CIDRS:-}
      ESPIAL_NOTIFICATION_ALLOWED_PORTS: ${ESPIAL_NOTIFICATION_ALLOWED_PORTS:-443}
      ESPIAL_NOTIFICATION_SECRET_DIRECTORY: /run/secrets
      ESPIAL_DATABASE_DSN_FILE: /run/secrets/database_dsn
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ESPIAL_CORE_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "/espial", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    secrets:
      - database_dsn
      - mattermost_webhook

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - espial-postgres:/var/lib/postgresql/data

volumes:
  espial-postgres:

secrets:
  database_dsn:
    file: ${ESPIAL_DATABASE_DSN_SECRET_FILE:-./database_dsn.example}
  mattermost_webhook:
    file: ${ESPIAL_MATTERMOST_WEBHOOK_SECRET_FILE:-./mattermost_webhook.example}
